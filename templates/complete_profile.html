{% extends "base.html" %}

{% block title %}프로필 완성하기{% endblock %}

{% block content %}
<div class="auth-container">
    <h2>프로필 완성하기</h2>
    <p>환영합니다! 원활한 서비스 이용을 위해 몇 가지만 더 알려주세요.</p>

    <form method="POST" action="{{ url_for('complete_profile') }}">
        <div class="form-group">
            <label for="company">소속 기관/회사 (선택)</label>
            <input type="text" id="company" name="company" value="{{ current_user.company or '' }}">
        </div>
        <div class="form-group">
            <label for="role">직무 또는 역할 (선택)</label>
            <input type="text" id="role" name="role" value="{{ current_user.role or '' }}" placeholder="예: 품질 관리, 데이터 분석가">
        </div>

        <hr class="form-divider">
        
        <div class="form-group">
            <label for="admin_code">관리자 코드 (관리자만 입력)</label>
            <input type="text" id="admin_code" name="admin_code" placeholder="관리자 코드를 입력하세요">
            <div id="admin-code-feedback" class="feedback-message"></div>
        </div>

        <button type="submit" class="auth-btn">정보 입력 완료</button>
    </form>
</div>

<script>
$(function() {
    let adminCodeCheckTimeout;  // 디바운싱 타이머

    $('#admin_code').on('input', function() {
        const code = $(this).val();
        const feedback = $('#admin-code-feedback');
        clearTimeout(adminCodeCheckTimeout);  // 이전 타이머 취소

        // 입력창이 비어있으면 메시지 숨김
        if (code === '') {
            feedback.text('');
            return;
        }

        // 0.5초 디바운싱: 타이핑이 멈춘 후 0.5초 뒤에 서버에 요청
        adminCodeCheckTimeout = setTimeout(() => {
            $.ajax({
                url: '/check_admin_code',
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify({ admin_code: code }),
                success: function(response) {
                    if (response.valid) {
                        feedback.text('관리자 코드가 확인되었습니다.').removeClass('unavailable').addClass('available');
                    } else {
                        feedback.text('올바르지 않은 관리자 코드입니다.').removeClass('available').addClass('unavailable');
                    }
                }
            });
        }, 500);
    });
})
</script>
{% endblock %}
