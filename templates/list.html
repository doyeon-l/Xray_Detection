{% extends "base.html" %}

{% block title %}분류 결과 목록{% endblock %}

{% block head %}
<style>
    /* 정렬 가능한 테이블 헤더에 마우스 커서 변경 */
    .sortable { cursor: pointer; }
    .sortable:hover { background-color: #f2f2f2; }
    /* 재분류 버튼 스타일 */
    .reclassify-btn { padding: 4px 8px; border: 1px solid #ccc; border-radius: 4px; cursor: pointer; white-space: nowrap;}  /* 20250813 이도연 수정 (white-space: nowrap; 추가) */
    .reclassify-btn:hover { opacity: 0.8; }
    .btn-to-good { background-color: #28a745; color: white; }
    .btn-to-bad { background-color: #dc3545; color: white; }
    /* 메모 관련 스타일 */
    .note-btn { padding: 3px 6px; font-size: 0.8rem; background-color: #6c757d; color: white; border: none; border-radius: 3px; cursor: pointer;}
    .note-btn:hover { background-color: #5a6268; }
    .note-text { font-size: 0.9em; color: #555; }

    /* XAI 버튼 스타일 */
    .xai-btn {
        padding: 4px 8px;
        background-color: #17a2b8;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 0.9em;
    }
    .xai-btn:hover { background-color: #138496; }
    .xai-btn:disabled { background-color: #ccc; cursor: not-allowed; }

    /* XAI 이미지가 이미 생성된 버튼의 스타일 (초록색) */
    .xai-btn.generated {
        background-color: #28a745; /* '성공/완료'를 의미하는 초록색 */
    }

    .xai-btn.generated:hover {
        background-color: #218838; /* 호버 시 더 어두운 초록색 */
    }

	#image-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 1000;}
    #modal-img { max-width: 90%; max-height: 90%; }
</style>
{% endblock %}

{% block content %}
<div class="list-section">
    <h2 class=" list_title">분류 이미지 목록</h2>

    <!-- 지도/비지도 탭 UI -->
    <div class="tab-container">
        <button class="tab-btn active" data-model="S">지도학습</button>
        <button class="tab-btn" data-model="U">비지도학습</button>
    </div>

    <!-- 1. 조회 기능 섹션 -->
    <div class="controls">
        <div class="filter-group">
            <span>기준일:</span>
            <input type="text" id="from_date" readonly> ~ <input type="text" id="to_date" readonly>
            <select id="class_filter"><option value="">전체</option><option value="1">GOOD</option><option value="0">BAD</option></select>
            <select id="anomaly_filter">
                <option value="">모든 이상 점수</option>
                <option value="high">높은 이상 점수만</option>
            </select>
            <input type="text" id="search_term" placeholder="파일명 검색...">
            <button id="search_btn">검색</button>
        </div>
    </div>

    <!-- 2. 데이터 관리 기능 섹션 -->
    <div class="controls">
        <div class="action-group">
            <span id="reclassified-info" style="font-weight: bold; margin-right: 15px; display: none;"></span>
            <button id="batch-reclassify-btn">일괄 판정 전환</button>
            <button id="reclassify-selected-btn">선택 판정 반전</button>
            <button id="delete-btn" class="btn-delete">선택 삭제</button>
            <button id="delete-by-date-btn" class="btn-delete">기간 삭제</button>
            <button id="delete-all-btn" class="btn-delete">전체 삭제</button>
            <a href="#" id="export_btn" class="export-btn">CSV로 내보내기</a>
        </div>
    </div>

    <!-- 3. 이미지 업로드 섹션 -->
    <div id="upload_section">
        <h3>이미지 업로드:</h3>
        <span>기준일:</span>
        <input type="text" id="upload_std_date" readonly>
        <input type="file" id="upload_files" multiple>
        <button id="confirm_upload">업로드 실행</button>
    </div>

    <br/>
    <div>총 건수: <span id="total_count">0</span></div>
    <div id="list-container">
        <table>
            <thead>
            <tr>
                <th><input type="checkbox" id="check_all"></th>
                <th>이미지</th>
                <th class="sortable" data-column="org_image_name"><span>파일명</span><span class="sort-icon"></span></th>
                <th>모델</th>
                
                <!-- 도움말 아이콘 (판정, 이상 점수, XAI) -->
                <th>판정 <i class="fas fa-info-circle help-icon" data-help="prediction"></i></th>
                <th class="sortable unsupervised-only" data-column="anomaly_score"><span>이상 점수</span> <i class="fas fa-info-circle help-icon" data-help="anomaly"></i><span class="sort-icon"></span></th>                
                <th class="sortable" data-column="created_at"><span>업로드 일시</span><span class="sort-icon"></span></th>            
                <th>메모</th>
                <th>재분류</th>
                <th>수정자</th>
                <th>수정일시</th>
                <th>XAI <i class="fas fa-info-circle help-icon" data-help="xai"></i></th>
            </tr>
            </thead>
            <tbody id="result_body"></tbody>
        </table>
    </div>

    <!-- 페이지네이션 컨트롤이 렌더링될 영역 -->
    <div id="pagination-controls"></div>

    <div id="image-modal" style="display:none;"><img id="modal-img" src="" /></div>

    <!-- 도움말 팝오버 HTML 구조 (평소에는 숨겨져 있음.) -->
    <div id="help-popover">
        <div id="popover-content"></div>
    </div>
</div>

<script>
    $(function() {
        // --- 상태 관리 변수 ---
        let sortBy = 'created_at';
        let sortOrder = 'DESC';
        let currentPage = 1;  // 현재 페이지 상태를 관리하는 변수
        const itemsPerPage = 20;  // 한 페이지에 표시할 항목 수
        let currentModelTab = 'S';  // 현재 활성화된 탭을 관리 ('S'가 기본)

        // 현재 업로드의 XHR과 Socket 객체를 저장할 전역 변수
        let currentUploadXhr = null;
        let currentUploadSocket = null;

        // --- 날짜 선택기 초기화 ---
        const today = new Date();
        const aMonthAgo = new Date();
        aMonthAgo.setMonth(today.getMonth() - 1);

        $("#from_date, #upload_std_date").datepicker({ dateFormat: 'yy-mm-dd', maxDate: 0 });
        $("#to_date").datepicker({ dateFormat: 'yy-mm-dd', maxDate: 0 });
        
        $("#from_date").datepicker("setDate", aMonthAgo);
        $("#to_date").datepicker("setDate", today);
        $("#upload_std_date").datepicker("setDate", today);
        $("#from_date, #to_date, #upload_std_date").css('cursor', 'pointer');

        // 페이지네이션 렌더링 함수
        function renderPagination(totalItems) {
            const totalPages = Math.ceil(totalItems / itemsPerPage);
            const controls = $('#pagination-controls').empty();
            
            // 💡 데이터가 없어도 페이지네이션 컨트롤 자체는 보이도록 수정
            if (totalPages <= 0) {
                // 데이터가 아예 없을 경우, 비활성화된 1페이지 버튼만 표시
                controls.html(`
                <ul class="pagination">
                    <li class="page-item disabled"><span class="page-link">&laquo;</span></li>
                    <li class="page-item disabled"><span class="page-link">&lsaquo;</span></li>
                    <li class="page-item active"><span class="page-link">1</span></li>
                    <li class="page-item disabled"><span class="page-link">&rsaquo;</span></li>
                    <li class="page-item disabled"><span class="page-link">&raquo;</span></li>
                </ul>
                `);
                return;
            }

            let paginationHtml = '<ul class="pagination">';
            
            // 맨 처음(<<) & 이전(<) 버튼
            paginationHtml += `<li class="page-item ${currentPage === 1 ? 'disabled' : ''}"><a class="page-link" href="#" data-page="1">&laquo;</a></li>`;
            paginationHtml += `<li class="page-item ${currentPage === 1 ? 'disabled' : ''}"><a class="page-link" href="#" data-page="${currentPage - 1}">&lsaquo;</a></li>`;

            // 페이지 번호 버튼 (현재 페이지 주변 5개만 표시)
            let startPage = Math.max(1, currentPage - 2);
            let endPage = Math.min(totalPages, currentPage + 2);

            if (startPage > 1) {
                paginationHtml += `<li class="page-item"><a class="page-link" href="#" data-page="1">1</a></li>`;
                if (startPage > 2) paginationHtml += `<li class="page-item disabled"><span class="page-link">...</span></li>`;
            }
            for (let i = startPage; i <= endPage; i++) {
                paginationHtml += `<li class="page-item ${i === currentPage ? 'active' : ''}"><a class="page-link" href="#" data-page="${i}">${i}</a></li>`;
            }
            if (endPage < totalPages) {
                if (endPage < totalPages - 1) paginationHtml += `<li class="page-item disabled"><span class="page-link">...</span></li>`;
                paginationHtml += `<li class="page-item"><a class="page-link" href="#" data-page="${totalPages}">${totalPages}</a></li>`;
            }

            // 다음(>) & 맨 끝(>>) 버튼
            paginationHtml += `<li class="page-item ${currentPage === totalPages ? 'disabled' : ''}"><a class="page-link" href="#" data-page="${currentPage + 1}">&rsaquo;</a></li>`;
            paginationHtml += `<li class="page-item ${currentPage === totalPages ? 'disabled' : ''}"><a class="page-link" href="#" data-page="${totalPages}">&raquo;</a></li>`;
            
            paginationHtml += '</ul>';
            controls.html(paginationHtml);
        }

        // --- 데이터 로드 및 테이블 렌더링 함수 ---
        function loadList(page = 1) {
            currentPage = page;
            const params = {
                from_date: $('#from_date').val().replace(/-/g, ''),
                to_date: $('#to_date').val().replace(/-/g, ''),
                yolo_class: $('#class_filter').val(),
                search_term: $('#search_term').val(),
                model_gb: currentModelTab,  // 탭 상태를 API 파라미터로 전송
                sort_by: sortBy,
                sort_order: sortOrder,
                page: currentPage,
                limit: itemsPerPage
            };

            $.get('/api/list', params, function(response) {
                const data = response.data;
                const totalItems = response.total;

                $('#result_body').empty();
                $('#total_count').text(totalItems);
                // CSV 내보내기 버튼 클릭 시 모달 창 표시
                $('#export_btn').on('click', function() {
                    // 오늘 날짜를 YYYY-MM-DD 형식으로 기본값 설정
                    const today = new Date().toISOString().slice(0, 10);

                    $('#modal-title').text('CSV 상세 내보내기 옵션');
                    $('#modal-body').html(`
                        <div class="form-group">
                            <label>기간 선택:</label>
                            <input type="date" id="csv-from-date" value="${today}"> ~ <input type="date" id="csv-to-date" value="${today}">
                        </div>
                        <div class="form-group">
                            <label>모델 선택:</label>
                            <select id="csv-model-gb">
                                <option value="S">지도학습</option>
                                <option value="U">비지도학습</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>판정 상태 필터:</label>
                            <select id="csv-yolo-class">
                                <option value="">모두</option>
                                <option value="1">GOOD만</option>
                                <option value="0">BAD만</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>재분류 필터:</label>
                            <select id="csv-is-reclassified">
                                <option value="">모두</option>
                                <option value="1">재분류된 항목만</option>
                                <option value="0">원본 판정 항목만</option>
                            </select>
                        </div>
                        <hr style="margin: 20px 0;">
                        <div class="form-group">
                            <label>포함할 추가 정보:</label>
                            <div class="checkbox-group">
                                <input type="checkbox" id="csv-include-score">
                                <label for="csv-include-score">신뢰도 점수(지도) / 이상 점수(비지도)</label>
                            </div>
                            <div class="checkbox-group">
                                <input type="checkbox" id="csv-include-note">
                                <label for="csv-include-note">메모 내용</label>
                            </div>
                            <div class="checkbox-group">
                                <input type="checkbox" id="csv-include-history">
                                <label for="csv-include-history">수정 이력</label>
                            </div>
                            <div class="checkbox-group">
                                <input type="checkbox" id="csv-include-xai">
                                <label for="csv-include-xai">XAI 이미지 경로</label>
                            </div>
                        </div>
                    `);

                    // 모달의 확인 버튼 클릭 시 동작
                    $('#modal-confirm-btn').text('내보내기').off('click').on('click', function() {
                        const params = {
                            from_date: $('#csv-from-date').val().replace(/-/g, ''),
                            to_date: $('#csv-to-date').val().replace(/-/g, ''),
                            model_gb: $('#csv-model-gb').val(),
                            yolo_class: $('#csv-yolo-class').val(),
                            is_reclassified: $('#csv-is-reclassified').val(),
                            include_score: $('#csv-include-score').is(':checked'),
                            include_note: $('#csv-include-note').is(':checked'),
                            include_history: $('#csv-include-history').is(':checked'),
                            include_xai_path: $('#csv-include-xai').is(':checked'),
                            include_note: $('#csv-include-note').is(':checked'),
                            include_history: $('#csv-include-history').is(':checked'),
                            include_xai_path: $('#csv-include-xai').is(':checked')
                        };
                        
                        // 파라미터를 쿼리 스트링으로 만들어 새 창에서 다운로드
                        const queryString = $.param(params);
                        window.location.href = `/api/export?${queryString}`;

                        $('#action-modal').fadeOut();
                    });

                    $('#action-modal').fadeIn();
                });

                let displayData = data;
                if ($('#anomaly_filter').val() === 'high') {
                    const anomalyScores = data.map(d => d.anomaly_score).filter(s => s !== null && s !== undefined);
                    const threshold = anomalyScores.length > 0 ? anomalyScores.sort((a, b) => b - a)[Math.floor(anomalyScores.length * 0.05)] : 0.1;
                    displayData = data.filter(d => d.anomaly_score >= threshold && d.yolo_class == '1');
                }

                $.each(displayData, function(_, row) {
                    // 재분류 버튼에 data-name 속성 추가
                    const reclassifyBtn = (row.yolo_class == '1')
                        ? `<button class="reclassify-btn btn-to-bad" data-id="${row.id}" data-name="${row.org_image_name}" data-new-class="0">불량 처리</button>`
                        : `<button class="reclassify-btn btn-to-good" data-id="${row.id}" data-name="${row.org_image_name}" data-new-class="1">정상 처리</button>`;

                    const anomalyScoreText = (row.anomaly_score != null) ? row.anomaly_score.toFixed(4) : 'N/A';
                    const anomalyStyle = (row.anomaly_score > 0.1) ? 'color: red; font-weight: bold;' : '';
                    const modelText = row.model_gb === 'S' ? '지도' : (row.model_gb === 'U' ? '비지도' : 'N/A');

                    // XAI 이미지 경로 존재 여부를 확인하여 버튼에 'generated' 클래스를 추가
                    const hasXai = row.xai_image_path ? 'generated' : '';
                    const xaiBtn = `<button class="xai-btn ${hasXai}" data-id="${row.id}">보기</button>`;

                    // 테이블 행(tr)에 수정자, 수정일시 데이터 셀(td) 추가
                    const tr = `
                    <tr>
                        <td><input type="checkbox" class="row_chk" data-id="${row.id}"></td>
                        <td><img src="/${row.image_path}" class="thumbnail" data-full="/${row.image_path}"></td>
                        <td>${row.org_image_name || ''}</td>
                        <td><b>${modelText}</b></td>
                        <td>${Number(row.yolo_class) === 1 ? '<b style="color:blue">GOOD</b>' : '<b style="color:red">BAD</b>'}</td>
                        <td class="unsupervised-only" style="${anomalyStyle}">${anomalyScoreText}</td>

                        <td>${row.created_at || ''}</td>
                        <td>
                        <button class="note-btn" data-id="${row.id}" data-note="${row.note || ''}">메모</button>
                        <span class="note-text">${row.note || ''}</span>
                        </td>
                        <td>${reclassifyBtn}</td>
                        <td>${row.modified_by || ''}</td>
                        <td>${row.modified_at || ''}</td>
                        <td>${xaiBtn}</td>
                    </tr>`;
                    $('#result_body').append(tr);
                });

                // 테이블이 다시 그려진 후, 현재 탭 상태에 맞게 컬럼을 다시 숨기거나 보여줍니다.
                if (currentModelTab === 'S') {
                    $('.unsupervised-only').hide();
                } else {
                    $('.unsupervised-only').show();
                }

                renderPagination(totalItems);
            }).fail(function() {
                alert("데이터를 불러오는 데 실패했습니다. 서버 상태를 확인해주세요.");
            });
        }

        // --- 이벤트 핸들러 바인딩 ---

        // 최초 로드
        loadList(1);

        // --- 페이지가 처음 로드될 때, 비지도 전용 요소들을 모두 숨긴다. ---
        $('.unsupervised-only').hide();  // 테이블 컬럼 숨기기
        $('#anomaly_filter').hide();     // 검색 필터 숨기기

        // 탭 클릭 이벤트 핸들러
        $('.tab-btn').on('click', function() {
            $('.tab-btn').removeClass('active');
            $(this).addClass('active');
            currentModelTab = $(this).data('model');

            const modelName = currentModelTab === 'S' ? '지도학습' : '비지도학습';
            $('#upload-model-indicator').text(`${modelName} 모델로 업로드`);

            // 탭 상태에 따라 '이상 점수' 컬럼과 '검색 필터'를 함께 제어한다.
            if (currentModelTab === 'S') {
                $('.unsupervised-only').hide();  // 지도학습 탭이면 컬럼 숨김.
                $('#anomaly_filter').hide();     // 지도학습 탭이면 필터 숨김.
            } else {
                $('.unsupervised-only').show();  // 비지도학습 탭이면 컬럼 보임.
                $('#anomaly_filter').show();     // 비지도학습 탭이면 필터 보임.
            }
            
            // 탭을 바꾸면 필터는 초기화하고 1페이지부터 다시 로드
            // $('#upload_files').val(null);  // 탭을 전환할 때마다, 파일 선택 창의 내용을 강제로 비워서 초기화
            $('#class_filter').val('');
            $('#anomaly_filter').val('');
            $('#search_term').val('');
            loadList(1);
        });

        // 검색 버튼을 클릭했을 때만 1페이지로 새로고침
        $('#search_btn').on('click', function() {
            loadList(1);
        });

        // 필터 변경(change)이나 검색어 입력(keypress)은 '검색' 버튼 클릭으로 이어지도록 한다.
        $('#anomaly_filter, #class_filter').on('change', function() {
            // 필터만 바꾸고, 자동으로 검색하지 않는다.
        });
        $('#search_term').on('keypress', e => { 
            if (e.which === 13) { // Enter 키를 누르면
            $('#search_btn').click(); // 검색 버튼을 클릭한 것과 동일하게 동작
            }
        });
        
        // 페이지네이션 링크 클릭 이벤트
        $(document).on('click', '.pagination a', function(e) {
            e.preventDefault();
            const page = $(this).data('page');
            if (page) {
                loadList(page);
            }
        });

        // 테이블 헤더 정렬
        $('.sortable').click(function() {
            const column = $(this).data('column');
            if (sortBy === column) {
                sortOrder = (sortOrder === 'ASC') ? 'DESC' : 'ASC';
            } else {
                sortBy = column;
                sortOrder = 'DESC';
            }
            $('.sort-icon').text('');
            $(this).find('.sort-icon').text(sortOrder === 'ASC' ? ' 🔼' : ' 🔽');
            loadList(currentPage);  // 현재 페이지에서 정렬
        });

        // 업로드 버튼 클릭 이벤트를 웹소켓 방식으로 수정
        $('#confirm_upload').on('click', function () {
            const formData = new FormData();
            const files = $('#upload_files')[0].files;
            const stdDate = $('#upload_std_date').val().replace(/-/g, '');
            const modelGb = currentModelTab;

            if (!stdDate || files.length === 0) {
                showToast('기준일과 업로드할 파일을 모두 선택해주세요.', 'error');
                return;
            }

            formData.append('std_date', stdDate);
            formData.append('model_gb', modelGb);
            for (let i = 0; i < files.length; i++) { formData.append('files', files[i]); }

            const overlay = $('#upload-progress-overlay');
            const progressBar = $('#progress-bar');
            const progressText = $('#progress-text');
            
            // ----- 1. 웹소켓 연결 및 이벤트 리스너 설정 -----
            // 연결과 동시에 고유한 세션 ID(sid)를 받는다.
            currentUploadSocket = io(); // 소켓을 전역 변수에 저장
            let sid = null;

            // 연결 성공 시
            currentUploadSocket.on('connect', function() {
                sid = currentUploadSocket.id;
                startUpload();
            });

            // 자원 정리 함수
            function cleanup() {
                if (currentUploadSocket) {
                    currentUploadSocket.disconnect();
                    currentUploadSocket = null;
                }
                currentUploadXhr = null;
            }

            currentUploadSocket.on('upload_progress', function(data) {
                const percent = Math.round((data.current / data.total) * 100);
                progressBar.css('width', percent + '%'); // 바 업데이트
                progressText.text(`서버 처리 중... (${data.current}/${data.total})`);
            });
            
            currentUploadSocket.on('upload_complete', function(data) {
                if (data.status === 'success') {
                    progressBar.css('width', '100%');
                    progressText.text('작업 완료!');
                } else {
                    progressText.text(data.message);
                }
                setTimeout(() => { 
                    overlay.fadeOut(300);
                    loadList(1);
                    cleanup();
                }, 1000);
            });
            
            currentUploadSocket.on('upload_canceled', function(data) {
                showToast(data.message, 'warning');
                overlay.fadeOut(300);
                cleanup();
            });

            function startUpload() {
                currentUploadXhr = $.ajax({ // AJAX 객체를 전역 변수에 저장
                    url: `/upload?sid=${sid}`,
                    type: 'POST',
                    data: formData,
                    contentType: false,
                    processData: false,
                    xhr: function() {
                        const xhr = new window.XMLHttpRequest();
                        xhr.upload.addEventListener('progress', function(evt) {
                            if (evt.lengthComputable) {
                                const percent = Math.round((evt.loaded / evt.total) * 100);
                                progressBar.css('width', percent + '%');
                                progressText.text(`파일 전송 중... ${percent}%`);
                            }
                        }, false);
                        return xhr;
                    },
                    success: function (response) {
                        currentUploadXhr = null; // 전송이 끝났으므로 XHR 변수는 비움
                        if (response.status === 'processing_started') {
                            progressBar.css('width', '0%'); // 바는 0%로 초기화
                            progressText.text('서버에서 처리 대기 중...');
                        } else {
                            showToast(response.message || '업로드 요청 실패', 'error');
                            overlay.fadeOut(300);
                            cleanup();
                        }
                    },
                    error: function (jqXHR, textStatus, errorThrown) {
                        if (textStatus !== 'abort') {
                            showToast('파일 전송 중 서버 오류가 발생했습니다.', 'error');
                            overlay.fadeOut(300);
                            cleanup();
                        }
                    }
                });
            }
        
            // 로딩창 초기 상태 설정
            progressBar.css('width', '0%');  // 항상 0%에서 시작
            progressText.text('파일 준비 중...');
            overlay.css('display', 'flex').hide().fadeIn(200);
        });

        // 업로드 취소 버튼 클릭 이벤트 핸들러
            $(document).on('click', '#cancel-upload-btn', function() {
            // 1. 파일 전송(AJAX)이 진행 중이면, 전송을 중단한다.
            if (currentUploadXhr) {
                currentUploadXhr.abort();
                showToast('업로드를 취소했습니다.', 'warning');
                $('#progress-text').text('취소 중...');
                $('#upload-progress-overlay').fadeOut(300);
            } 
            // 2. 서버 처리(WebSocket)가 진행 중이면, 서버에 취소 요청을 보낸다.
            else if (currentUploadSocket && currentUploadSocket.connected) {
                currentUploadSocket.emit('cancel_upload');
                $('#progress-text').text('취소 요청 중...');
            }
        });

        // 재분류 개수를 확인하고 업데이트하는 함수
        function checkReclassifiedCount() {
            $.getJSON('/api/reclassified_count', function(data) {
                const count = data.count;
                const infoSpan = $('#reclassified-info');
                if (count > 0) {
                    infoSpan.html(`재분류: <span style="color: #007bff;">${count}</span>건`);
                    infoSpan.show();
                } else {
                    infoSpan.hide();
                }
            });
        }

        // 재분류 작업이 끝날 때마다 개수를 다시 확인하도록 호출 추가
        function reclassifyCompleteHandler() {
            loadList(currentPage);
            $('#check_all').prop('checked', false);
            checkReclassifiedCount();  // 개수 새로고침
        }

        // 개별 재분류 버튼
        $(document).on('click', '.reclassify-btn', function() {
            const itemId = $(this).data('id');
            const itemName = $(this).data('name');
            const newClass = $(this).data('new-class').toString();
            const actionText = newClass === '1' ? '정상' : '불량';

            if (confirm(`'${itemName}' 파일을 '${actionText}'(으)로 변경하시겠습니까?`)) {
                $.ajax({
                    url: '/api/reclassify', type: 'POST', contentType: 'application/json',
                    data: JSON.stringify({ id: itemId, new_class: newClass }),
                    success: res => {
                        if (res.status === 'success') {
                            showToast(`'${itemName}' 파일의 판정이 변경되었습니다.`, 'success');
                            reclassifyCompleteHandler();
                        } else {
                            showToast('오류: ' + res.message, 'error');
                        }
                    },
                    error: () => showToast('서버 통신 오류가 발생했습니다.', 'error')
                });
            }
        });
        
        $(document).on('click', '.thumbnail', function () {
            const fullSrc = $(this).data('full');
            $('#modal-img').attr('src', fullSrc);
            $('#image-modal').css('display', 'flex').fadeIn();
        });

        $('#image-modal').click(function () {
            $(this).fadeOut();
        });  

        // 메모 버튼 (이벤트 핸들러 추가)
        $(document).on('click', '.note-btn', function() {
            const btn = $(this);
            const itemId = btn.data('id');
            const currentNote = btn.data('note') || '';  // null일 경우 빈 문자열로 처리
            const newNote = prompt("메모를 입력하세요:", currentNote);

            if (newNote !== null && newNote !== currentNote) {
                $.ajax({
                    url: '/api/update_note',
                    type: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify({ id: itemId, note: newNote }),
                    success: function(res) {
                        if(res.status === 'success') {
                            alert("메모가 저장되었습니다.");
                            btn.data('note', newNote);
                            btn.siblings('.note-text').text(newNote);
                        } else {
                            alert("메모 저장에 실패했습니다.");
                        }
                    },
                    error: function() {
                        alert("서버 통신 오류가 발생했습니다.");
                    }
                });
            }
        });

        // 도움말 내용 정의
        const helpContent = {
            prediction: {
                title: '판정 (Prediction)',
                text: "지도학습 AI 모델이 이미지를 분석하여 '정상(GOOD)' 또는 '불량(BAD)'으로 내린 **최종 결론**입니다. 사용자가 직접 '재분류' 버튼을 통해 이 판정을 수정할 수 있습니다."
            },
            anomaly: {
                title: '이상 점수 (Anomaly Score)',
                text: "비지도학습 AI 모델이 계산한 '낯섦'의 정도입니다. 점수가 <strong>높을수록</strong> AI가 보기에 학습된 정상 제품 패턴과 다르다는 의미이며, 알려지지 않은 새로운 유형의 불량일 가능성이 있습니다."
            },
            xai: {
                title: 'XAI (설명 가능한 AI)',
                text: "'보기' 버튼을 클릭하면 AI가 이미지의 어느 부분을 보고 판정을 내렸는지 <strong>히트맵(Heatmap)</strong>으로 시각화하여 보여줍니다.<br><br><strong>중요:</strong> '보기' 버튼을 실행해야 XAI 이미지가 생성되며, 생성된 이후에만 CSV 내보내기에 경로가 포함됩니다.<br><br><strong>버튼 색상 안내:</strong> <strong>파란색 버튼</strong>은 아직 생성되지 않은 상태이며, <strong>초록색 버튼</strong>은 이미지가 생성되어 바로 볼 수 있는 상태입니다."
            }
        };

        // 도움말 아이콘에 마우스 호버(mouseover/mouseleave) 이벤트
        let popoverTimeout;  // 팝오버가 바로 사라지지 않도록 하기 위한 타이머 변수

        // 아이콘에 마우스를 올렸을 때
        $(document).on('mouseover', '.help-icon', function(e) {
            clearTimeout(popoverTimeout);
            
            const helpKey = $(this).data('help');
            const content = helpContent[helpKey];
            const popover = $('#help-popover');

            $('#popover-content').html(`<h4>${content.title}</h4><p>${content.text}</p>`);
            
            const iconPos = $(this).offset();
            const popoverWidth = popover.outerWidth();
            const windowWidth = $(window).width();

            // 팝오버의 left 위치를 동적으로 계산한다.
            let popoverLeft = iconPos.left - (popoverWidth / 2) + ($(this).width() / 2);

            // 만약 팝오버가 화면 오른쪽을 벗어난다면, 위치를 조정한다.
            if (popoverLeft + popoverWidth > windowWidth - 20) {  // 20px의 여백
                popoverLeft = windowWidth - popoverWidth - 20;
            }

            // 만약 팝오버가 화면 왼쪽을 벗어난다면, 위치를 조정한다.
            if (popoverLeft < 10) {  // 10px의 여백
                popoverLeft = 10;
            }

            popover.css({
                top: iconPos.top + 25 + 'px',
                left: popoverLeft + 'px'  // 계산된 left 값을 적용한다.
            }).fadeIn(200);
        });

        // 아이콘에서 마우스가 벗어났을 때
        $(document).on('mouseleave', '.help-icon', function() {
            // 바로 사라지지 않고, 0.3초의 유예 시간을 둠 (팝오버 위로 마우스를 옮길 시간을 주기 위함.)
            popoverTimeout = setTimeout(function() {
                $('#help-popover').fadeOut(200);
            }, 300);
        });

        // 팝오버 창 자체에 마우스를 올렸을 때는 사라지지 않도록 처리
        $('#help-popover').on('mouseover', function() {
            clearTimeout(popoverTimeout);  // 사라지는 타이머 취소
        });

        // 팝오버 창에서 마우스가 벗어나면 즉시 사라지도록 처리
        $('#help-popover').on('mouseleave', function() {
            $(this).fadeOut(200);
        });

        $('#check_all').click(function() {
            $('.row_chk').prop('checked', $(this).is(':checked'));
        });

        $('#delete-btn').click(function() {
            const ids = $('.row_chk:checked').map((_, el) => $(el).data('id')).get();
            if (ids.length == 0) return alert("선택된 항목이 없습니다.");

            if (confirm("정말 삭제하시겠습니까?")) {
                $.ajax({
                    url: '/api/delete',
                    type: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify({ ids }),
                    success: function(res) {
                        // 1. 목록을 1페이지로 새로고침
                        loadList(1);
                        // 2. '전체 선택' 체크박스를 해제
                        $('#check_all').prop('checked', false);
                        // 3. 삭제 후 재분류 개수를 다시 확인
                        checkReclassifiedCount();
                    },
                    error: function() {
                        alert("삭제 중 오류가 발생했습니다.");
                    }
                });
            }
        });

        // '기간 삭제' 버튼 클릭 시
        $('#delete-by-date-btn').on('click', function() {
            $('#modal-title').text('기간별 데이터 삭제');
            $('#modal-body').html(`
                <div class="form-group">
                    <label>삭제할 기간을 선택하세요. 이 작업은 되돌릴 수 없습니다.</label>
                    <input type="date" id="modal-from-date"> ~ <input type="date" id="modal-to-date">
                </div>
            `);
            $('#modal-confirm-btn').text('삭제 실행').off('click').on('click', function() {
                const fromDate = $('#modal-from-date').val().replace(/-/g, '');
                const toDate = $('#modal-to-date').val().replace(/-/g, '');
                if (!fromDate || !toDate) return showToast('기간을 올바르게 선택해주세요.', 'error');
                
                $.ajax({
                    url: '/api/delete_by_date', type: 'POST', contentType: 'application/json',
                    data: JSON.stringify({ from_date: fromDate, to_date: toDate }),
                    success: function(res) {
                        showToast(`${res.deleted_count}건의 데이터가 휴지통으로 이동했습니다.`, 'success');
                        loadList(1); checkReclassifiedCount();
                    },
                    error: function() { showToast('삭제 중 오류가 발생했습니다.', 'error'); }
                });
                $('#action-modal').fadeOut();
            });
            $('#action-modal').fadeIn();
        });

        // '일괄 판정 전환' 버튼 클릭 시
        $('#batch-reclassify-btn').on('click', function() {
            const total = $('#total_count').text();
            const modelName = currentModelTab === 'S' ? '지도학습' : '비지도학습';

            $('#modal-title').text('일괄 판정 전환');
            $('#modal-body').html(`
                <p><strong>적용 대상:</strong> 현재 조회된 <strong>(${modelName}) ${total}건</strong> 전체</p>
                <div class="form-group">
                    <label for="modal-from-class">다음 판정의 항목을:</label>
                    <select id="modal-from-class">
                        <option value="0">BAD (불량)</option>
                        <option value="1">GOOD (정상)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="modal-to-class">아래 판정으로 변경합니다:</label>
                    <select id="modal-to-class">
                        <option value="1">GOOD (정상)</option>
                        <option value="0">BAD (불량)</option>
                    </select>
                </div>
            `);
            $('#modal-confirm-btn').text('전환 실행').off('click').on('click', function() {
                const params = {
                    from_date: $('#from_date').val().replace(/-/g, ''),
                    to_date: $('#to_date').val().replace(/-/g, ''),
                    from_class: $('#modal-from-class').val(),
                    to_class: $('#modal-to-class').val(),
                    model_gb: currentModelTab
                };

                if (confirm(`정말로 현재 조회된 모든 항목에 대해 판정을 전환하시겠습니까?`)) {
                    $.ajax({
                        url: '/api/reclassify_by_period', type: 'POST', contentType: 'application/json',
                        data: JSON.stringify(params),
                        success: function(res) {
                            showToast(res.message, 'success');
                            reclassifyCompleteHandler();
                        },
                        error: function() { showToast('일괄 전환 중 오류가 발생했습니다.', 'error'); }
                    });
                    $('#action-modal').fadeOut();
                }
            });
            $('#action-modal').fadeIn();
        });

        // 모달 취소 버튼 및 오버레이 클릭 시 닫기
        $('#modal-cancel-btn, #action-modal').on('click', function(e) {
            if (e.target === this) {
                $('#action-modal').fadeOut();
            }
        });
        $('.modal-content').on('click', function(e) { e.stopPropagation(); });

        // 전체 삭제 버튼 클릭 이벤트
        $('#delete-all-btn').on('click', function() {
            if (prompt("모든 데이터를 영구적으로 삭제하려면 '전체삭제'를 입력하세요.") === '전체삭제') {
                $.ajax({
                    url: '/api/delete_all',
                    type: 'POST',
                    success: function(res) {
                        if (res.status === 'success') {
                            alert('모든 데이터가 삭제되었습니다.');
                            loadList(1);  // 1페이지로 새로고침
                            // 삭제 후 재분류 개수를 다시 확인
                            checkReclassifiedCount();
                        }
                    },
                    error: function() { alert('삭제 중 오류가 발생했습니다.'); }
                });
            } else {
                alert('입력이 일치하지 않아 작업을 취소했습니다.');
            }
        });

        // XAI 버튼 클릭 이벤트 핸들러
        $(document).on('click', '.xai-btn', function() {
            const btn = $(this);
            const itemId = btn.data('id');
            btn.text('생성중...').prop('disabled', true);

            $.get(`/api/grad_cam/${itemId}`, function(response) {
                if (response.status === 'success') {
                    $('#modal-img').attr('src', `/${response.xai_path}?t=${new Date().getTime()}`);  // 캐시 방지
                    $('#image-modal').css('display', 'flex').fadeIn();
                } else {
                    alert('XAI 이미지 생성 실패: ' + response.message);
                }
            }).fail(function() {
                alert('서버 오류로 XAI 이미지를 가져올 수 없습니다.');
            }).always(function() {
                btn.text('보기').prop('disabled', false);
            });
        });

        // 선택 항목 일괄 판정 전환 버튼 클릭 이벤트
        $('#reclassify-selected-btn').on('click', function() {
            const checkedRows = $('.row_chk:checked');
            if (checkedRows.length === 0) {
                showToast("판정을 전환할 항목을 먼저 선택해주세요.", 'error');
                return;
            }

            let itemsToReclassify = [];
            checkedRows.each(function() {
                const row = $(this).closest('tr');
                const id = $(this).data('id');
                const currentStatusText = row.find('td:nth-child(5)').text();
                const currentClass = currentStatusText.includes('GOOD') ? '1' : '0';
                itemsToReclassify.push({
                    id: id,
                    current_class: currentClass
                });
            });

            if (confirm(`${itemsToReclassify.length}개 항목의 판정을 전환하시겠습니까?`)) {
                $.ajax({
                    url: '/api/reclassify_batch',
                    type: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify({ items: itemsToReclassify }),
                    success: function(res) {
                        if (res.status === 'success') {
                        showToast(`${itemsToReclassify.length}개 항목의 판정이 전환되었습니다.`, 'success');
                        reclassifyCompleteHandler();
                        } else {
                        showToast('일괄 처리 중 오류가 발생했습니다: ' + res.message, 'error');
                        }
                    },
                    // 실패 토스트 알림 표시
                    error: function() {
                        showToast('서버 통신 오류가 발생했습니다.', 'error');
                    }
                });
            }
        });

        // 페이지가 처음 로드될 때도 개수를 확인
        loadList(1);
        checkReclassifiedCount();
    }); // <-- $(function() { 의 닫는 부분
</script>
{% endblock %}
