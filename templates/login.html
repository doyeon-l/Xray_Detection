{% extends "base.html" %}

{% block title %}로그인{% endblock %}

{% block content %}
<div class="auth-container">
    <h2>로그인</h2>
    <p>X-Ray 이물 검출 시스템을 이용하려면 로그인하세요.</p>

    <form method="POST" action="{{ url_for('login') }}" id="login-form" novalidate>
        <div class="form-group">
            <label for="userid">아이디</label>
            <input type="text" id="userid" name="userid" value="{{ userid or '' }}" required>
            <div class="feedback-message"></div>
        </div>
        <div class="form-group">
            <label for="password">비밀번호</label>
            <input type="password" id="password" name="password" required>
            <div class="feedback-message"></div>
        </div>
        <button type="submit" class="auth-btn">로그인</button>
    </form>
    <div class="auth-switch">
        <p>계정이 없으신가요? <a href="{{ url_for('register') }}">회원가입</a></p>
        <!-- 계정 찾기 링크 추가 -->
        <p><a href="{{ url_for('find_account') }}">아이디/비밀번호를 잊으셨나요?</a></p>
    </div>

    <!-- 소셜 로그인 구분선 및 버튼 -->
    <div style="display: flex; align-items: center; text-align: center; margin: 20px 0;">
        <hr style="flex-grow: 1; border: none; border-top: 1px solid #eee;">
        <span style="padding: 0 10px; color: #888; font-size: 0.9em;">OR</span>
        <hr style="flex-grow: 1; border: none; border-top: 1px solid #eee;">
    </div>
    <a href="{{ url_for('login_google') }}" class="auth-btn social-login-btn google">
        <!-- Google의 공식 G 로고 SVG 아이콘 -->
        <svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
            <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"></path>
            <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"></path>
            <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"></path>
            <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"></path>
            <path fill="none" d="M0 0h48v48H0z"></path>
        </svg>
        <span>Google로 계속하기</span>
    </a>
    <!-- 카카오톡 로그인 버튼 -->
    <a href="{{ url_for('login_kakao') }}" class="auth-btn social-login-btn kakao">
        <img src="{{ url_for('static', filename='img/kakao_connect_btn.png') }}" alt="카카오 로그인"/>
    </a>
</div>

<script>
$(function() {
    // 실시간 필수 항목 검사 (focusout)
    $('#userid, #password').on('focusout', function() {
        const field = $(this);
        const feedback = field.siblings('.feedback-message');
        if (field.val() === '') {
            feedback.text('필수 입력 항목입니다.').addClass('unavailable');
        } else {
            feedback.text('').removeClass('unavailable');
        }
    });

    // 로그인 버튼 클릭 시 최종 검사
    $('#login-form').on('submit', function(event) {
        let hasError = false;
        
        const useridField = $('#userid');
        const passwordField = $('#password');

        if (useridField.val() === '') {
            useridField.siblings('.feedback-message').text('아이디를 입력해주세요.').addClass('unavailable');
            hasError = true;
        }
        if (passwordField.val() === '') {
            passwordField.siblings('.feedback-message').text('비밀번호를 입력해주세요.').addClass('unavailable');
            hasError = true;
        }

        if (hasError) {
            // 서버로 폼이 제출되는 것을 막음.
            event.preventDefault();
        }
    });
});
</script>
{% endblock %}
