{% extends "base.html" %}

{% block title %}비밀번호 재설정{% endblock %}

{% block content %}
<div class="auth-container">
    <h2>새 비밀번호 설정</h2>
    <p>새로 사용할 비밀번호를 입력해주세요.</p>

    <!-- novalidate 속성은 브라우저 기본 유효성 검사를 비활성화하여
        우리가 만든 커스텀 유효성 검사가 작동하도록 합니다. -->
    <form method="POST" action="{{ url_for('reset_password_token', token=token) }}" novalidate>
        <div class="form-group">
            <label for="password">새 비밀번호</label>
            <!-- placeholder와 피드백 메시지를 표시할 div 추가 -->
            <input type="password" id="password" name="password" required placeholder="8~16자 입력">
            <div id="password-length-feedback" class="feedback-message"></div>
        </div>
        <div class="form-group">
            <label for="password_confirm">새 비밀번호 확인</label>
            <!-- 피드백 메시지를 표시할 div 추가 -->
            <input type="password" id="password_confirm" name="password_confirm" required>
            <div id="password-confirm-feedback" class="feedback-message"></div>
        </div>
        <button type="submit" class="auth-btn">비밀번호 변경</button>
    </form>
</div>

<script>
$(function() {
    let isPasswordLengthValid = false;
    let isPasswordDifferent = false;
    let isPasswordMatch = false;
    let passwordCheckTimeout;  // 디바운싱 타이머

    const MIN_PASSWORD_LENGTH = 8;
    const MAX_PASSWORD_LENGTH = 16;

    // --- 1. 새 비밀번호 유효성 통합 검사 (길이 + 현재와 다른지 여부) ---
    $('#password').on('input', function() {
        const password = $(this).val();
        const length = password.length;
        const feedback = $('#password-length-feedback');
        clearTimeout(passwordCheckTimeout);

        // 1-1. 길이 검사
        if (length === 0) {
            feedback.text('');
            isPasswordLengthValid = false;
            isPasswordDifferent = false;
            return;
        }
        if (length < MIN_PASSWORD_LENGTH || length > MAX_PASSWORD_LENGTH) {
            feedback.text('비밀번호는 8자 이상, 16자 이하로 설정해주세요.').removeClass('available').addClass('unavailable');
            isPasswordLengthValid = false;
            isPasswordDifferent = false;
            return;
        }
        
        // 길이가 유효하다면, 잠시 후 서버에 '현재 비밀번호와 다른지' 확인
        isPasswordLengthValid = true;
        feedback.text('확인 중...').removeClass('available unavailable');
        
        passwordCheckTimeout = setTimeout(() => {
            $.ajax({
                url: '/api/check_new_password_is_different',
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify({
                    token: '{{ token }}',
                    new_password: password
                }),
                success: function(response) {
                    if (response.is_different) {
                        feedback.text('사용 가능한 비밀번호입니다.').removeClass('unavailable').addClass('available');
                        isPasswordDifferent = true;
                    } else {
                        feedback.text('새 비밀번호는 현재 비밀번호와 다르게 설정해야 합니다.').removeClass('available').addClass('unavailable');
                        isPasswordDifferent = false;
                    }
                }
            });
        }, 500);
    });

    // --- 2. 새 비밀번호 일치 검사 ---
    $('#password, #password_confirm').on('input', function() {
        const password = $('#password').val();
        const passwordConfirm = $('#password_confirm').val();
        const feedback = $('#password-confirm-feedback');

        if (passwordConfirm === '') {
            feedback.text('');
            isPasswordMatch = false;
            return;
        }
        if (password === passwordConfirm) {
            feedback.text('비밀번호가 일치합니다.').removeClass('unavailable').addClass('available');
            isPasswordMatch = true;
        } else {
            feedback.text('비밀번호가 일치하지 않습니다.').removeClass('available').addClass('unavailable');
            isPasswordMatch = false;
        }
    });

    // --- 3. 최종 제출 검사 ---
    $('form').on('submit', function(event) {
        let errorMessages = [];
        if (!isPasswordLengthValid) errorMessages.push('비밀번호 규칙(8~16자)을 확인해주세요.');
        if (!isPasswordDifferent) errorMessages.push('새 비밀번호는 현재 비밀번호와 달라야 합니다.');
        if (!isPasswordMatch) errorMessages.push('비밀번호가 일치하지 않습니다.');

        if (errorMessages.length > 0) {
            event.preventDefault();
            alert(errorMessages.join('\n'));
        }
    });
});
</script>
{% endblock %}
